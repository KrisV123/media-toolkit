    "mdurl==0.1.2",
    "msgpack==1.2.2",
    "multidict==6.9.1",
    "mutagen==1.48.1",
    "platformdirs==4.12.0",
    "propcache==0.5.4",
    "pygments==2.21.0",
    "pywin32==312",
    "rich==15.0.0",
    "textual==8.2.8",
    "textual-dev==1.8.0",
    "textual-serve==1.1.3",
